# Report-only Codecov configuration.
#
# Both the project and patch status checks are informational: Codecov posts
# coverage context on PRs (status + comment) but never marks the check as
# failed, so a coverage dip can't block a merge. Tighten later by removing
# `informational: true` and setting explicit targets.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: 'reach, diff, files'
  require_changes: false
