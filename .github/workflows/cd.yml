name: CD

on:
  push:
    branches: [main]

# A newer main push supersedes an older deployment. The receiver also rejects
# an already-seen run id, covering an SSH process that outlives cancellation.
concurrency:
  group: cd-main
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION_FILE: .nvmrc

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run deploy:check
      - name: Package validated build
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          payload="$RUNNER_TEMP/solux-payload.tar.gz"
          metadata="$RUNNER_TEMP/.solux-deploy.json"
          printf '{"repository":"%s","sha":"%s","runId":%s}\n' \
            "$DEPLOY_REPOSITORY" "$DEPLOY_SHA" "$DEPLOY_RUN_ID" > "$metadata"
          tar --sort=name --owner=0 --group=0 --numeric-owner -czf "$payload" \
            -C "$RUNNER_TEMP" .solux-deploy.json \
            -C "$GITHUB_WORKSPACE/dist" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solux-deploy-payload
          path: ${{ runner.temp }}/solux-payload.tar.gz
          if-no-files-found: error
          retention-days: 2

  deploy:
    name: Deliver to production
    needs: verify
    runs-on: ubuntu-latest
    # Secrets are scoped to this trusted main-only job, never to PR workflows.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: solux-deploy-payload
          path: ${{ runner.temp }}/solux-payload
      - name: Configure pinned SSH host key
        env:
          HOST_KEY: ${{ vars.SOLUX_DEPLOY_HOST_KEY }}
        run: |
          set -eu
          test -n "$HOST_KEY"
          umask 077
          printf '%s\n' "$HOST_KEY" > "$RUNNER_TEMP/known_hosts"
      - name: Deliver payload over forced-command SSH
        env:
          DEPLOY_KEY: ${{ secrets.SOLUX_DEPLOY_PRIVATE_KEY }}
          PAYLOAD: ${{ runner.temp }}/solux-payload/solux-payload.tar.gz
          HOST: ssh.archnet.lol
        run: |
          set -eu
          test -n "$DEPLOY_KEY"
          umask 077
          key="$RUNNER_TEMP/deploy_key"
          cleanup() { rm -f "$key" "$RUNNER_TEMP/known_hosts"; }
          trap cleanup EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          ssh -i "$key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o RequestTTY=no \
            -o ClearAllForwardings=yes \
            solux-deploy@"$HOST" < "$PAYLOAD"
          health_status="$(curl --fail --silent --show-error \
            --output /dev/null --write-out '%{http_code}' \
            https://aslan.archnet.lol/health/solux)"
          test "$health_status" = 204
          expected_asset="$(tar -tzf "$PAYLOAD" \
            | sed -n 's#^\./\(assets/index-[^/]*\.js\)$#\1#p' \
            | head -n 1)"
          test -n "$expected_asset"
          served_index="$(curl --fail --silent --show-error \
            https://aslan.archnet.lol/solux/index.html)"
          printf '%s' "$served_index" | grep -Fq "/solux/$expected_asset"
          expected_hash="$(tar -xOzf "$PAYLOAD" "./$expected_asset" \
            | sha256sum | awk '{print $1}')"
          served_hash="$(curl --fail --silent --show-error \
            "https://aslan.archnet.lol/solux/$expected_asset" \
            | sha256sum | awk '{print $1}')"
          test "$served_hash" = "$expected_hash"
