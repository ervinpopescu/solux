name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so a rapid push sequence doesn't
# pile up redundant CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege baseline: all jobs get read-only access by default.
# Jobs that need more scope (e.g. Codecov PR comments) override it inline.
permissions:
  contents: read

jobs:
  # Stage 1 — Style + formatting. Must pass before later stages run.
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  # Stage 2 — Type safety + unit correctness. Blocked on lint passing.
  test:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    needs: lint
    # pull-requests: write lets codecov-action post a coverage comment on the PR.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm run test:coverage

      # Report-only (see codecov.yml). fail_ci_if_error stays false so a
      # missing token or a transient Codecov outage never breaks the build.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # Stage 3 — End-to-end browser tests. Blocked on typecheck & unit tests passing.
  # Builds the app, serves it with vite preview, and runs the hermetic mocked-network
  # specs in Chromium. Uploads the HTML report as an artifact on failure for post-mortem inspection.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
